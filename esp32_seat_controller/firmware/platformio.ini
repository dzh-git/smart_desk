[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.1
    fastled/FastLED@^3.9.15
    adafruit/Adafruit_VL53L0X@^1.2.4
